version: "3.9"

services:
  gateway-service:
    build:
      context: .
      dockerfile: services/gateway-service/Dockerfile
    ports:
      - "8000:8000"
    env_file:
      - .env
    depends_on:
      - orchestrator-service

  orchestrator-service:
    build:
      context: .
      dockerfile: services/orchestrator-service/Dockerfile
    expose:
      - "8001"
    env_file:
      - .env
    depends_on:
      - rag-service
      - tool-service
      - audit-service

  rag-service:
    build:
      context: .
      dockerfile: services/rag-service/Dockerfile
    expose:
      - "8002"
    env_file:
      - .env

  tool-service:
    build:
      context: .
      dockerfile: services/tool-service/Dockerfile
    expose:
      - "8003"
    env_file:
      - .env

  ingestion-service:
    build:
      context: .
      dockerfile: services/ingestion-service/Dockerfile
    expose:
      - "8004"
    env_file:
      - .env

  audit-service:
    build:
      context: .
      dockerfile: services/audit-service/Dockerfile
    expose:
      - "8005"
    env_file:
      - .env
